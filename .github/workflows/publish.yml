name: 发布

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: v1.0.0)'
        required: true
        default: 'v1.0.0'

# Actions 列表页直接显示「发布 v1.0.0」，不用点进运行详情才知道打的是哪个版本
run-name: 发布 ${{ github.event.inputs.version }}

jobs:
  # 手工触发的发布流程，把「编译二进制」和「发布镜像 / 建 Release」合成一条工作流。
  #
  # 阶段划分：
  #   打包二进制 ──┬──→ 发布容器镜像
  #                └──→ 创建 Release
  #
  # 后两个都只依赖二进制产物、互相不依赖，所以会并行执行——这是整条流程里唯一
  # 真正存在的并行机会。
  build:
    name: 打包二进制
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          # 生成变更日志需要拿到上一个 tag，浅克隆取不到
          fetch-depth: 0

      - name: 设置 Go 环境
        uses: actions/setup-go@v6
        with:
          go-version-file: 'src/go.mod'
          cache-dependency-path: 'src/go.sum'

      - name: 设置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache-dependency-path: web/package-lock.json

      - name: 构建前端
        run: |
          cd web
          npm ci
          npm run build

      - name: 获取版本号
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "版本号: $VERSION"

      - name: 生成变更日志
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
            echo "## 更新内容" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            git log --pretty=format:"- %s" "$PREV_TAG"..HEAD >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "changelog=## 首次发布" >> "$GITHUB_OUTPUT"
          fi

      - name: 创建构建目录
        run: mkdir -p build/hubproxy

      - name: 安装 UPX
        uses: crazy-max/ghaction-upx@v4
        with:
          install-only: true

      - name: 安装 nFPM
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3

      - name: 编译二进制文件
        run: |
          cd src
          VERSION="${{ steps.version.outputs.version }}"

          # Linux AMD64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.Version=${VERSION}" -o ../build/hubproxy/hubproxy-linux-amd64 .

          # Linux ARM64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.Version=${VERSION}" -o ../build/hubproxy/hubproxy-linux-arm64 .

          # 压缩二进制文件
          upx -9 ../build/hubproxy/hubproxy-linux-amd64
          upx -9 ../build/hubproxy/hubproxy-linux-arm64

      - name: 准备压缩包文件
        run: cp src/config.toml build/hubproxy/

      - name: 创建压缩包
        run: |
          cd build

          # Linux AMD64 包
          mkdir -p linux-amd64/hubproxy
          cp hubproxy/hubproxy-linux-amd64 linux-amd64/hubproxy/hubproxy
          cp hubproxy/config.toml linux-amd64/hubproxy/
          tar -czf hubproxy-linux-amd64.tar.gz -C linux-amd64 hubproxy

          # Linux ARM64 包
          mkdir -p linux-arm64/hubproxy
          cp hubproxy/hubproxy-linux-arm64 linux-arm64/hubproxy/hubproxy
          cp hubproxy/config.toml linux-arm64/hubproxy/
          tar -czf hubproxy-linux-arm64.tar.gz -C linux-arm64 hubproxy

          ls -la ./*.tar.gz

      - name: 创建 Linux 发行版安装包
        run: |
          mkdir -p build/packages
          VERSION="${{ steps.version.outputs.version }}"
          NFPM_VERSION="${VERSION#v}"

          package() {
            hubproxy_arch="$1"
            nfpm_arch="$2"
            packager="$3"
            config="$4"
            target="build/packages/hubproxy-linux-${hubproxy_arch}.${packager}"
            temp_dir="build/packages/${hubproxy_arch}-${packager}"
            binary="./build/hubproxy/hubproxy-linux-${hubproxy_arch}"

            rm -rf "${temp_dir}"
            mkdir -p "${temp_dir}"
            rm -rf build/package-root
            mkdir -p build/package-root
            cp "${binary}" build/package-root/hubproxy
            NFPM_ARCH="${nfpm_arch}" NFPM_VERSION="${NFPM_VERSION}" nfpm package --config "${config}" --packager "${packager}" --target "${temp_dir}/"
            mv "${temp_dir}"/*."${packager}" "${target}"
            rm -rf "${temp_dir}"
            rm -rf build/package-root
          }

          # AMD64 包
          package amd64 amd64 deb packaging/nfpm.deb-rpm.yaml
          package amd64 amd64 rpm packaging/nfpm.deb-rpm.yaml
          package amd64 amd64 apk packaging/nfpm.apk.yaml

          # ARM64 包
          package arm64 arm64 deb packaging/nfpm.deb-rpm.yaml
          package arm64 arm64 rpm packaging/nfpm.deb-rpm.yaml
          package arm64 arm64 apk packaging/nfpm.apk.yaml

          ls -la build/packages

      - name: 检查安装包内容
        run: |
          dpkg-deb -c build/packages/hubproxy-linux-amd64.deb
          rpm -qpl build/packages/hubproxy-linux-amd64.rpm
          tar -tf build/packages/hubproxy-linux-amd64.apk

      # 只上传 build/hubproxy/*（而不是整个 build/），这样 artifact 的根就是
      # build/hubproxy，镜像 job 直接下载到同一路径即可，无需拼路径。
      - name: 上传原始二进制（供镜像构建使用）
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: build/hubproxy/*
          if-no-files-found: error

      - name: 上传分发包（供 Release 使用）
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            build/*.tar.gz
            build/packages/*
          if-no-files-found: error

  image:
    name: 发布容器镜像
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 下载原始二进制
        uses: actions/download-artifact@v8
        with:
          name: binaries
          path: build/hubproxy

      # artifact 的上传下载不保留文件权限位。少了这一步，镜像里的 ./hubproxy
      # 会因权限不足起不来，而且报错信息不会直接指向这里。
      - name: 恢复可执行权限
        run: chmod +x build/hubproxy/hubproxy-linux-*

      # Dockerfile.runtime 里的 RUN mkdir 在 arm64 上需要模拟执行。
      # 若将来把那条 RUN 去掉，这一步也可以一并去掉。
      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 不需要 --build-arg VERSION：版本号已在「编译二进制文件」那一步通过
      # -ldflags -X main.Version 写进二进制，镜像只是把它搬进去。
      - name: 构建并推送镜像
        run: |
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION#v}"
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

          echo "推送 ghcr.io/${REPO_LOWER}:${VERSION} 与 :latest"

          docker buildx build --push \
            --platform linux/amd64,linux/arm64 \
            --tag "ghcr.io/${REPO_LOWER}:${VERSION}" \
            --tag "ghcr.io/${REPO_LOWER}:latest" \
            -f Dockerfile.runtime .

  release:
    name: 创建 Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 下载分发包
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: dist

      - name: 创建或更新 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: "HubProxy ${{ github.event.inputs.version }}"
          body: |
            ${{ needs.build.outputs.changelog }}

            ## 下载文件

            - **Linux AMD64**: `hubproxy-linux-amd64.tar.gz`
            - **Linux ARM64**: `hubproxy-linux-arm64.tar.gz`
            - **Debian/Ubuntu**: `.deb`
            - **RHEL/CentOS/Fedora**: `.rpm`
            - **Alpine Linux**: `.apk`
          files: |
            dist/*.tar.gz
            dist/packages/*
          overwrite_files: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
